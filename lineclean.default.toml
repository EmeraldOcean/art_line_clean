# ============================================================================
# lineclean 설정 템플릿 (D-15, D-17)
# ============================================================================
# 이 파일은 기본값과 설명을 담은 템플릿입니다. 값은 모두 코드 기본값과 같고, 테스트가 이를 확인합니다.
# 이 파일은 직접 고치지 말고 복사해서 쓰세요.
#
# 사용법
#   - 이 파일을 lineclean.toml로 복사해 값을 바꾸면, 현재 폴더의 lineclean.toml을 자동으로 읽습니다.
#       Copy-Item lineclean.default.toml lineclean.toml      (PowerShell)
#     lineclean.toml은 내 설정 파일이라 git에 올라가지 않습니다. 없으면 코드 기본값으로 실행합니다.
#   - 실행할 때 "설정: ..." 줄에 어느 파일을 썼는지 나옵니다.
#   - 여러 설정을 비교할 때는 복사본을 더 만들어(예: configs/try1.toml) --config로 지정하세요.
#       uv run python -m lineclean 입력.png -o output/try1.png --merge-ids 3,7 --smooth --render --config configs/try1.toml
#   - 바꾸고 싶은 값만 적어도 됩니다. 적지 않은 값은 기본값이 쓰입니다.
#   - 모르는 섹션·키나 범위를 벗어난 값은 실행 전에 오류로 알려 줍니다 (오타로 기본값이 조용히 쓰이지 않게).
#   - 후보 번호(--merge-ids)는 설정에 따라 바뀝니다. 설정을 바꾸면 --merge로 번호부터 다시 확인하세요.
#
# 용어
#   w   = 선 굵기 (픽셀). "~_widths" 값은 선 굵기의 몇 배인지를 뜻합니다. 굵기가 다른 그림에도 같은 의미로 쓰려고.
#   σ   = 가우시안(부드럽게 하는) 범위. 클수록 더 넓은 범위를 평균 내어 더 매끈해집니다.
#   D-n = docs/DECISIONS.md의 결정 번호. 기본값을 정한 근거가 적혀 있습니다.
#
# 표시
#   [권장 조정] 결과 품질을 맞출 때 주로 만지는 값
#   [주의]      바꾸면 결과가 예측하기 어렵게 달라지거나 안전장치가 약해지는 값


# ----------------------------------------------------------------------------
# [graph] 선 구조 읽기 — 모든 단계(병합·평활·다시 그리기·검사)가 같이 씁니다 (D-8)
# ----------------------------------------------------------------------------
[graph]
# [주의] 이 알파(0~255) 이상인 픽셀만 잉크로 봅니다.
#   올리면: 옅은 선·연필 번짐이 선 구조에서 빠짐 (희미한 선이 끊기거나 사라질 수 있음)
#   내리면: 옅은 번짐까지 선으로 봐서 잔가지·고리가 늘어남
#   다시 그리기(--render)에서는 이보다 옅은 픽셀이 지워집니다. 범위 1~255
ink_threshold = 16

# [권장 조정] 자동 잉크 판정 (D-19): 주변(아래 크기 안)에서 가장 진한 값의 이 비율 이상이어야 잉크로 봅니다.
#   진한 선 옆의 옅은 번짐이 가까운 두 선을 이어 버리는 것을 막습니다 (예: 눈 원과 아래 눈꺼풀 선).
#   주변에 진한 선이 없는 옅은 선(보조선 등)은 위의 ink_threshold만 적용되어 그대로 남습니다.
#   올리면: 붙어 있던 선이 더 잘 떨어짐 (한 획 안의 옅은 부분까지 빠져 선이 끊길 수 있음)
#   내리면: 번짐으로 가까운 선이 이어짐. 0이면 끄고 ink_threshold만 씁니다 (연필 러프처럼 획 안 진하기가
#           들쭉날쭉한 그림은 0이 나을 수 있음). 범위 0~0.9
ink_relative = 0.3

# 위 "주변"의 크기 (px, 홀수 권장). 선 굵기와 선 사이 간격을 덮을 만큼이면 됩니다.
#   올리면: 더 멀리 있는 진한 선의 영향도 받음 / 내리면: 바로 옆만 봄. 범위 3~51
ink_relative_window_px = 7

# [주의] 잔가지 가지치기: 분기점에서 뻗은 짧은 가지가 "이 값 × 선 반지름"보다 짧으면 지웁니다.
#   올리면: 연필 가장자리 요철로 생긴 가지가 더 많이 정리됨 (짧은 진짜 선도 지워질 수 있음)
#   내리면: 짧은 가지가 남아 분기점이 늘어남
prune_factor = 2.0

# 선 조각들을 하나의 획으로 이을 때 허용하는 꺾임 각도(도).
#   올리면: 많이 꺾인 곳도 한 획으로 이어짐 (서로 다른 선이 한 획으로 엮일 수 있음)
#   내리면: 조금만 꺾여도 획이 끊김 → 덧그림 판정·떨림 완화가 짧은 조각 단위로 일어남
#   범위 1~90
continuation_deg = 35.0


# ----------------------------------------------------------------------------
# [junction] 교차 판정 — 세선화가 얕은 X를 "분기점 두 개 + 다리"로 쪼갠 것을 교차점 하나로 합치는 기준 (D-11)
# ----------------------------------------------------------------------------
[junction]
# [주의] 다리 길이 상한 (선 굵기 배수). 이보다 긴 다리는 교차로 보지 않습니다.
#   올리면: 아주 얕은 교차도 합침 / 내리면: 얕은 교차가 분기점 두 개로 남음
max_bridge_widths = 10.0

# [주의] 다리 길이 상한을 교차각에 맞추는 계수. 상한 = 이 값 × w / sin(교차각/2)
#   얕게 교차할수록 두 선이 길게 붙어 다리가 길어지므로 각도에 따라 허용 길이를 늘립니다.
bridge_angle_factor = 2.0

# [주의] 가지 방향을 잴 거리 (선 굵기 배수). 분기점 바로 옆은 휘어 있어서 조금 떨어진 곳까지 봅니다.
#   올리면: 큰 흐름 기준(긴 곡선에서 부정확) / 내리면: 분기점 근처 휨에 흔들림
direction_reach_widths = 4.0

# [주의] 다리 너머로 이어지는 두 가지가 한 직선에서 벗어나도 되는 거리 (선 굵기 배수).
#   올리면: 어긋난 T 두 개도 X로 볼 수 있음 / 내리면: 휘어서 지나가는 교차를 놓칠 수 있음
max_line_offset_widths = 1.0


# ----------------------------------------------------------------------------
# [merge] 덧그림 병합 (--merge, --merge-ids) (D-10)
# ----------------------------------------------------------------------------
[merge]
# [권장 조정] 자동 병합(--merge) 기준: 짧은 쪽 획의 이 비율(0~1) 이상이 상대 획과 겹쳐야 합칩니다.
#   --merge-ids로 직접 고를 때는 쓰이지 않습니다.
#   내리면: 더 많이 자동으로 합침. 0.5 근처부터는 서로 다른 선(얕게 만나는 머리카락 등)도 합쳐질 위험
#   올리면: 거의 합치지 않음. 범위 0.01~1.0
min_cover = 0.8

# [권장 조정] 후보 번호를 붙이는 기준: 짧은 쪽 획의 이 비율 이상이 겹치면 후보로 보여 줍니다.
#   내리면: 후보가 늘어남 (고를 거리가 많아짐) / 올리면: 확실한 것만 후보로. 범위 0.01~1.0
candidate_cover = 0.4

# [권장 조정] "가까움" 기준: 두 선 중심 사이 거리가 선 굵기의 이 배수 이하일 때 겹친다고 봅니다.
#   올리면: 더 벌어진 덧그림도 후보로 잡음 (가까이 있는 다른 선도 잡힐 수 있음)
#   내리면: 아주 붙어 있는 덧그림만 잡음
max_center_dist_widths = 2.5

# [권장 조정] "나란함" 기준: 두 선 방향 차이(도)가 이 값 이하일 때 겹친다고 봅니다.
#   올리면: 덜 나란한 선도 덧그림으로 봄 / 내리면: 거의 평행한 것만. 범위 1~90
max_angle_deg = 20.0

# 겹친 길이 하한 (px). 이보다 짧게 겹친 것은 후보로 보지 않습니다. 아래 값과 큰 쪽이 쓰입니다.
#   내리면: 짧은 덧그림도 후보로 잡음 (잡음 같은 후보가 늘어날 수 있음)
min_overlap_px = 10.0

# 겹친 길이 하한 (선 굵기 배수). 위 값과 큰 쪽이 쓰입니다.
min_overlap_widths = 3.0

# [권장 조정] 합친 중간선의 끝을 이어지는 원래 획 위로 옮겨 붙이는 구간 길이 (선 굵기 배수).
#   올리면: 이음매가 더 길고 부드럽게 이어짐 (턱선 이음매가 꺾여 보이면 올려 보세요)
#   내리면: 이음매가 짧고 급해짐
blend_widths = 3.0

# 방향을 잴 때 잉크를 평균 내는 범위 σ (px). 연필 덧그림은 2~6px 조각으로 쪼개져서
# 조각 자체가 아니라 주변 잉크의 흐름으로 방향을 잽니다.
#   올리면: 큰 흐름만 봄 (가까운 다른 방향 선의 영향을 받음) / 내리면: 연필 질감에 흔들림
orientation_sigma = 2.0

# 두 획이 만나는 점에서 이 거리(선 굵기 배수) 안은 겹침으로 치지 않습니다 (만나는 곳은 당연히 가까우므로).
near_node_widths = 1.0

# 사다리 가로대·덧그림 끝 꼬리 같은 짧은 획을 그룹에 붙이는 기준: 점의 이 비율 이상이 그룹 근처에 있어야 합니다.
#   내리면: 근처의 다른 짧은 선까지 같이 지워질 수 있음. 범위 0.01~1.0
attach_fraction = 0.8


# ----------------------------------------------------------------------------
# [smooth] 떨림 완화 (--smooth) — 다시 그리지 않고 원본 픽셀을 최대 1px 옮깁니다 (D-12)
# ----------------------------------------------------------------------------
[smooth]
# [권장 조정] 이보다 작은 이동(px)은 하지 않습니다.
#   내리면: 작은 떨림도 고침 (0.2 이하에서는 깨끗한 직선·곡선까지 살짝 흐려짐)
#   올리면: 거의 움직이지 않음
min_shift_px = 0.4

# [권장 조정] 떨림을 거르는 범위 σ (선 굵기 배수).
#   올리면: 더 긴 흔들림까지 폄 (의도한 굴곡이 펴져 인상이 바뀔 수 있음)
#   내리면: 아주 짧은 떨림만 고침
sigma_widths = 2.5

# 최대 이동 거리 (px). 사용자 결정으로 1px. 실제 러프에서는 2로 올려도 결과가 같았습니다.
max_shift_px = 1.0

# [권장 조정] 다른 획이 이 거리(선 굵기 배수 + 2px) 안에 있으면 움직이지 않습니다.
#   덧그림 가닥이 서로 닿거나 떨어져 구조가 바뀌는 것을 막습니다.
#   내리면: 덧그림 가닥도 움직임 (가닥끼리 닿아 구조가 바뀌면 그 근처는 자동으로 되돌림)
isolation_widths = 2.0

# 이보다 많이 꺾이면(도) 모서리로 보고 그 점은 움직이지 않습니다. 범위 1~180
#   내리면: 완만한 굴곡도 모서리로 고정 / 올리면: 날카로운 꺾임도 둥글어질 수 있음
corner_deg = 45.0

# 꺾임각을 잴 앞뒤 거리 (선 굵기 배수).
corner_reach_widths = 3.0

# 분기점·끝점·모서리에서 이동량이 0에서 시작해 최대까지 커지는 거리 (선 굵기 배수).
#   올리면: 고정점 근처가 더 넓게 그대로 남음
pin_ramp_widths = 3.0

# 옮긴 뒤 구조(교차·분기·끝점)가 바뀐 곳에서 이 거리(px) 안을 지나는 획은 원래대로 되돌립니다.
revert_radius_px = 10.0

# [주의] 스켈레톤의 픽셀 계단을 지우는 범위 σ (px). 직선도 계단 때문에 0.5px씩 흔들려 보이는 것을 없앱니다.
base_sigma_px = 1.5


# ----------------------------------------------------------------------------
# [render] 깔끔한 선화로 다시 그리기 (--render) (D-14)
# ----------------------------------------------------------------------------
[render]
# [권장 조정] 굵기·진하기를 획을 따라 부드럽게 하는 범위 σ (선 굵기 배수).
#   올리면: 굵기·진하기가 더 균일한 매끈한 선 / 내리면: 원래 필압 변화가 더 많이 남음
profile_sigma_widths = 2.0

# [권장 조정] 측정한 굵기에서 빼는 번짐 폭 (px). 안티앨리어싱 번짐이 굵기 측정에 섞이는 것을 보정합니다.
#   내리면: 선이 굵어짐 (결과가 원본보다 가늘어 보이면 0~0.3)
#   올리면: 선이 가늘어짐. 0 이상
fringe_px = 0.5

# [권장 조정] 원하는 선 굵기 (px). 0이면 원본 굵기를 유지합니다 (D-18).
#   그림 전체 선 굵기의 중앙값이 이 값이 되도록 모든 획에 같은 배율을 곱합니다.
#   획마다 굵기 차이와 한 획 안의 필압 변화(끝이 가늘어지는 등)는 비율대로 남습니다.
#   가늘게 하면 그만큼 진하게 그려 잉크 양을 유지합니다 (원본이 옅으면 최대 불투명까지).
#   원본보다 굵게 하면 원본 잉크 + 2px 밖은 잘려서(비생성 원칙) 원하는 만큼 굵어지지 않을 수 있습니다.
#   실행할 때 "선 굵기 5.3 → 3.0px"처럼 측정 굵기와 결과 굵기를 출력합니다. 범위 0~50
target_width_px = 0.0

# [권장 조정] 굵기 상한: 획의 보통 굵기(중앙값)의 이 배수까지만 허용합니다.
#   덧그림 가닥이 닿은 곳에서 굵기가 튀어 굵은 구슬처럼 그려지는 것을 막습니다.
#   올리면: 굵은 부분을 더 허용 (구슬이 생길 수 있음) / 내리면: 선 굵기가 더 고르게 눌림
max_width_ratio = 1.5

# [주의] 중심선을 다듬는 범위 σ (px). 스켈레톤의 픽셀 계단을 지웁니다.
#   올리면: 중심선이 더 매끈해짐 (작은 굴곡이 사라질 수 있음) / 내리면: 원래 위치를 더 따라감
center_sigma_px = 1.5

# 다시 그린 뒤 선이 새로 붙거나 끊긴 곳에서 이 거리(px) 안을 지나는 획은 다시 그리지 않고 원본을 둡니다.
revert_radius_px = 10.0


# ----------------------------------------------------------------------------
# [checks] 안전 검사
# ----------------------------------------------------------------------------
[checks]
# [주의] 비생성 허용치 (px): 원본 잉크를 이만큼 넓힌 영역 밖에는 아무것도 그리지 않습니다 (절대 원칙 1, D-7).
#   1 또는 2만 허용합니다. 더 키우려면 결정 변경이 먼저 필요합니다.
nongeneration_d = 2

# 위상 검사에서 처리로 바뀐 픽셀로부터 이 거리(px) 안의 교차·분기·끝점은 비교에서 뺍니다
# (병합처럼 의도적으로 바꾼 곳까지 "바뀜"으로 보지 않게) (D-11). 0 이상
topology_ignore_px = 6


# ----------------------------------------------------------------------------
# 설정에 넣지 않은 값 (코드에 고정)
# ----------------------------------------------------------------------------
# 결과의 성격이 아니라 구현 정밀도에 관한 값이라 그대로 둡니다.
#   - 붓 렌더링 슈퍼샘플 4배, 붓 찍는 간격 0.25px  (render.py)
#   - 구조가 바뀐 곳 되돌리기 최대 3회           (smooth.py, render.py)
#   - 선 조각 끝 방향을 잴 길이 5px              (strokes.py)
#   - 연결 검사에서 무시하는 작은 덩어리 4px 미만 (junction.py)
